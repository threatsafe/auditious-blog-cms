name: Auditious Blog CMS CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Required for Payload to initialize during `generate:types` and `build`.
      # Add PAYLOAD_SECRET under Settings > Secrets and variables > Actions.
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      # SQLite DB file is committed to the repo, so just point at it.
      DATABASE_URL: file:./auditious-blog-cms.db
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Generate Payload Types
        run: npm run generate:types

      - name: Skip ESLint
        run: echo "Skipping ESLint"

      - name: Build Application
        run: npm run build
